name: Validate continuous menu v6
on:
  push:
    branches: [codex/continuous-menu-v6-20260920]
    paths: ['.github/workflows/continuous-v6-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fanfood-continuous-v6-validation
  cancel-in-progress: false
jobs:
  validate-continuous-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed source edits with exact preimage checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,zlib,hashlib,urllib.request
          from pathlib import Path
          encoded=b''
          for sha in ['4268b93496b89d610485357c5330ae251c97ddb4','442beffe6112faa58c0624b252781240f8211444']:
            req=urllib.request.Request('https://api.github.com/repos/HostX0/fan-food/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
            chunk=base64.b64decode(data['content']);assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha;encoded+=chunk
          raw=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(raw).hexdigest()=='2b9c8cf1ffde07d8bd5385a439664d0ab9f3243c118488bba328614bc9afcc18'
          changes=json.loads(raw);root=Path.cwd()
          for c in changes:
            assert c['p'].startswith(('src/','public/','tests/','docs/'))
            p=root/c['p'];assert p.resolve().is_relative_to(root) and not p.is_symlink()
            before=p.read_bytes() if p.exists() else None
            if c['sha']: assert before is not None and hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()==c['sha'], 'Concurrent change: '+c['p']
            else: assert before is None
            lines=before.decode().splitlines(keepends=True) if before is not None else []
            for start,end,replacement in reversed(c['edits']): lines[start:end]=[replacement]
            after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==c['after']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
          Path(os.environ['RUNNER_TEMP']+'/continuous-paths.json').write_text(json.dumps([c['p'] for c in changes]))
          PY
      - name: Stabilize native dialog restoration and repeated navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('src/components/primitives.tsx');s=p.read_text()
          def replace(a,b):
            global s
            assert s.count(a)==1, a
            s=s.replace(a,b)
          replace("    private previousOverflow = '';", "    private previousOverflow = '';\n    private previousScroll = {left: 0, top: 0};\n    private restorePagePosition = () => window.scrollTo({...this.previousScroll, behavior: 'instant'});")
          replace('        this.previousOverflow = document.body.style.overflow;', '        this.previousOverflow = document.body.style.overflow;\n        this.previousScroll = {left: window.scrollX, top: window.scrollY};')
          replace("        this.dialog?.querySelector<HTMLElement>('[data-dialog-heading]')?.focus({preventScroll: true});", "        this.dialog?.querySelector<HTMLElement>('[data-dialog-heading]')?.focus({preventScroll: true});\n        this.restorePagePosition();")
          replace("    componentWillUnmount() { this.dialog?.removeEventListener('cancel', this.cancel); this.dialog?.removeEventListener('keydown', this.trapTab); this.dialog?.close(); document.body.style.overflow = this.previousOverflow; this.lastFocus?.focus({ preventScroll: true }); }", """    componentWillUnmount() {
                  this.dialog?.removeEventListener('cancel', this.cancel);
                  this.dialog?.removeEventListener('keydown', this.trapTab);
                  this.dialog?.close();
                  document.body.style.overflow = this.previousOverflow;
                  this.lastFocus?.focus({preventScroll: true});
                  this.restorePagePosition();
                  const position = {...this.previousScroll};
                  requestAnimationFrame(() => {
                      if (!document.querySelector('dialog[open]')) window.scrollTo({...position, behavior: 'instant'});
                  });
              }""")
          p.write_text(s)
          p=Path('src/components/menu-app.tsx');s=p.read_text()
          replace('    private interruptNavigation = () => {', '    private interruptNavigation = () => {\n        cancelAnimationFrame(this.menuFrame);')
          replace("        const targetId = category === 'all' ? 'popular' : category;", "        const targetId = category === 'all' ? 'popular' : category;\n        const sameSection = targetId === this.state.category;\n        window.scrollTo({top: window.scrollY, left: window.scrollX, behavior: 'instant'});")
          replace("window.scrollTo({top, behavior: reduce ? 'instant' : 'smooth'});", "window.scrollTo({top, behavior: reduce || sameSection ? 'instant' : 'smooth'});")
          p.write_text(s)
          p=Path('tests/continuous-menu-browser.mjs');s=p.read_text()
          replace("  await manualScroll(page,'rice');const savedY=await page.evaluate(()=>scrollY);await page.locator('.header-cart').click();await page.getByRole('button',{name:'إغلاق السلة',exact:true}).click();await selected(page,'rice');assert.ok(Math.abs((await page.evaluate(()=>scrollY))-savedY)<5,'Closing cart must preserve reading position');", """  await manualScroll(page,'rice');const savedY=await page.evaluate(()=>scrollY);
            // Tap the visible sticky control, without an automation-induced scrollIntoView.
            const cartBox=await page.locator('.header-cart').boundingBox();assert.ok(cartBox.y>=0&&cartBox.y+cartBox.height<height);
            await page.mouse.click(cartBox.x+cartBox.width/2,cartBox.y+cartBox.height/2);
            await page.waitForFunction(()=>document.querySelector('dialog.cart-modal[open]'));
            const closeBox=await page.getByRole('button',{name:'إغلاق السلة',exact:true}).boundingBox();
            await page.mouse.click(closeBox.x+closeBox.width/2,closeBox.y+closeBox.height/2);
            await page.waitForFunction(()=>!document.querySelector('dialog.cart-modal[open]'));
            await selected(page,'rice');assert.ok(Math.abs((await page.evaluate(()=>scrollY))-savedY)<5,'Closing cart must preserve reading position');""")
          replace("if(active)await active.screenshot({path:dir+'/failure.png'}).catch(()=>{});", """if(active){
           await active.evaluate(()=>({y:scrollY,active:document.querySelector('#category-bar [aria-current="location"]')?.getAttribute('aria-controls'),sections:[...document.querySelectorAll('[data-menu-section]')].map(e=>({id:e.dataset.menuSection,top:e.getBoundingClientRect().top}))})).then(data=>fs.writeFileSync(dir+'/failure-geometry.json',JSON.stringify(data,null,2))).catch(()=>{});
           await active.screenshot({path:dir+'/failure.png'}).catch(()=>{});
          }""")
          p.write_text(s)
          p=Path('tests/polish-browser.mjs');s=p.read_text()
          replace('async function aligned(page){', 'async function aligned(page){\n // Allow the click handler frame to start before accepting a previously aligned section.\n await page.waitForTimeout(250);')
          p.write_text(s)
          p=Path(os.environ['RUNNER_TEMP']+'/continuous-paths.json');paths=json.loads(p.read_text());paths.append('src/components/primitives.tsx');p.write_text(json.dumps(paths))
          PY
      - name: Locked dependencies, unit tests, TypeScript and production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm test | tee "$RUNNER_TEMP/unit-tests.log"
          npm run typecheck
          npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fanfood-playwright-1.63.0-ubuntu-v1
      - name: Prepare browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Test continuous scrolling and every preserved ordering interaction
        env:
          BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/qa/package.json
        run: |
          node scripts/serve.mjs out > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
          REPORT_DIR=test-results/continuous-local node tests/continuous-menu-browser.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/polish-local node tests/polish-browser.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/browser-local node tests/browser-smoke.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/checkout-local node tests/checkout-enhancements.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/quick-local node tests/quick-controls.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/photos-local node tests/final-menu-browser.mjs
          REPORT_DIR=test-results/style-local node tests/production-style.mjs
      - name: Save validated source on review branch, leaving production unchanged
        run: |
          git fetch origin codex/continuous-menu-v6-20260920
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/continuous-menu-v6-20260920)" || { echo 'Review branch changed during validation'; exit 1; }
          python3 - <<'PY'
          import subprocess,json,os
          from pathlib import Path
          paths=json.loads(Path(os.environ['RUNNER_TEMP']+'/continuous-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'HostX0'
          git config user.email '42905848+HostX0@users.noreply.github.com'
          git commit -m 'Show all 58 dishes continuously with sticky category scroll tracking and shared featured quantities'
          git push origin HEAD:codex/continuous-menu-v6-20260920
          mkdir -p test-results
          git rev-parse HEAD > test-results/validated-commit.txt
          git archive --format=zip --output="$RUNNER_TEMP/FanFood_Continuous_Menu_Verified.zip" HEAD
      - name: Retain screenshots and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanfood-continuous-v6-${{ github.run_id }}
          path: |
            test-results/
            ${{ runner.temp }}/FanFood_Continuous_Menu_Verified.zip
            ${{ runner.temp }}/serve.log
            ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
          retention-days: 14
