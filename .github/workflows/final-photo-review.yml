name: Review unified Iraqi menu photography
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-photo-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download generated photographs and prepare review sheets
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json,hashlib,urllib.request,time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          entries='''211828 87ce2b81-64a3-4265-847c-ceba8d366ed0
          211829 adc3e07e-5cee-4e32-ac55-5d53615e0ac3
          211828 76fc81d8-ea49-4774-8cc0-5dda724823e4
