          212726 70af898a-44d3-42e5-953f-a76bd1a9449f
          212749 ec841b26-3209-4a6e-bcf6-70185ef8d14b
          212749 abea579d-589f-42fe-836e-330d8a8f3369
          212749 f58db34a-72bd-4414-be6b-0bf3400047b4
          212751 91f1bfa8-814d-42b1-9ef8-7d03b3dd469d
          212749 a723ffa3-7e8c-4051-9de5-628d24011725'''.splitlines()
          root=Path('photo-review');dest=root/'public/images/menu-v4';dest.mkdir(parents=True,exist_ok=True)
          def one(pair):
            i,line=pair;stamp,job=line.split();name=f'p{i:03d}' if i<59 else 'p047-chicken'
            url=f'https://d8j0ntlcm91z4.cloudfront.net/user_3CpFEvxerpl4o5efok2zUSBMeRV/hf_20260917_{stamp}_{job}.png'
            import io
            for attempt in range(3):
              try:
                with urllib.request.urlopen(url,timeout=90) as r: data=r.read()
                im=Image.open(io.BytesIO(data));im.load();assert im.width>=800 and im.height>=600
                break
              except Exception:
                if attempt==2: raise
                time.sleep(2)
            im=ImageOps.fit(im.convert('RGB'),(960,720),Image.Resampling.LANCZOS)
            files=[]
            for width,height,suffix,q in [(960,720,'',86),(480,360,'-sm',81)]:
              p=dest/f'{name}{suffix}.webp';im.resize((width,height),Image.Resampling.LANCZOS).save(p,'WEBP',quality=q,method=6)
              files.append({'path':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
            return {'index':i,'id':name,'job':job,'url':url,'files':files}
          with ThreadPoolExecutor(max_workers=6) as ex: results=list(ex.map(one,enumerate(entries,1)))
          assert len(results)==59
          (root/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',19)
          for start in range(0,59,12):
            sheet=Image.new('RGB',(1200,1320),'#f8f4e7');d=ImageDraw.Draw(sheet)
            for j,item in enumerate(results[start:start+12]):
              im=Image.open(dest/(item['id']+'.webp'));im.thumbnail((384,288));x=(j%3)*400+8;y=(j//3)*330+8
              sheet.paste(im,(x,y));d.text((x,y+292),item['id'],font=font,fill='#1f3a29')
            sheet.save(root/f'review-{start//12+1}.jpg',quality=93)
          print('Prepared 59 independent photos and 118 responsive assets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fanfood-photo-review-${{ github.run_id }}
          path: photo-review/
          retention-days: 14
          if-no-files-found: error
