name: Publish requested menu UX update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-ux-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fanfood-ux-publish
  cancel-in-progress: false
jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only the requested source changes with integrity checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,zlib,hashlib,urllib.request
          from pathlib import Path
          parts=['18b4f53de7cb92f4361fe3030f4277f34a53f87b','11923361e35a4dc578eefada726e68fca3d4de74','ce48670abb7286924a98a5d402487df14aa73841','2338d424e87b090caf95db56ea7814650d2c1b30']
          packed=b''
          for sha in parts:
            req=urllib.request.Request('https://api.github.com/repos/HostX0/fan-food/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
            chunk=base64.b64decode(data['content'])
            assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
            packed+=chunk
          raw=zlib.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='b63fc87ede624633a846549afd825fa9f51700707a2d7b8e5c1688626db8c2f0'
          changes=json.loads(raw);root=Path.cwd()
          for change in changes:
            p=root/change['p']
            assert p.resolve().is_relative_to(root) and not p.is_symlink()
            before=p.read_bytes() if p.exists() else None
            if change['sha']:
              assert before is not None and hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()==change['sha'], 'Concurrent change: '+change['p']
            else: assert before is None, 'Path already exists: '+change['p']
            lines=before.decode().splitlines(keepends=True) if before is not None else []
            for start,end,replacement in reversed(change['edits']): lines[start:end]=[replacement]
            after=''.join(lines).encode()
            assert hashlib.sha256(after).hexdigest()==change['after']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after)
            print('Updated',change['p'])
          Path(os.environ['RUNNER_TEMP']+'/ux-paths.json').write_text(json.dumps([c['p'] for c in changes]))
          PY
      - name: Prepare corrected half-chicken photograph
        run: |
          python3 -c 'import PIL' || python3 -m pip install --quiet Pillow
          curl -fsSL --retry 3 --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3CpFEvxerpl4o5efok2zUSBMeRV/hf_20260917_203256_636273cc-b7db-400d-a888-9400be60251c.png' -o "$RUNNER_TEMP/half-chicken.png"
          python3 - <<'PY'
          from PIL import Image,ImageOps
          import os
          from pathlib import Path
          im=Image.open(Path(os.environ['RUNNER_TEMP'])/'half-chicken.png');im.load()
          assert im.width>=800 and im.height>=600
          im=ImageOps.fit(im.convert('RGB'),(960,720),Image.Resampling.LANCZOS)
          im.save('public/images/products/p008-half-chicken.webp','WEBP',quality=88,method=6)
          Path('test-results').mkdir(exist_ok=True)
          im.save('test-results/half-chicken-review.jpg',quality=92)
          PY
      - name: Install locked dependencies, test and build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fanfood-playwright-1.63.0-ubuntu-v1
      - name: Prepare browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Check requested controls and existing checkout before publishing
        env:
          BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/qa/package.json
        run: |
          node scripts/serve.mjs out > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
          REPORT_DIR=test-results/quick-local node tests/quick-controls.mjs
          REPORT_DIR=test-results/browser-local node tests/browser-smoke.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/checkout-local node tests/checkout-enhancements.mjs
      - name: Publish validated changes to main without overwriting concurrent edits
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed during validation; refusing overwrite'; exit 1; }
          python3 - <<'PY'
          import subprocess,json,os
          from pathlib import Path
          paths=json.loads(Path(os.environ['RUNNER_TEMP']+'/ux-paths.json').read_text())
          subprocess.run(['git','add','--',*paths,'public/images/products/p008-half-chicken.webp'],check=True)
          PY
          git rm .github/workflows/apply-ux-release.yml
          git config user.name 'HostX0'
          git config user.email '42905848+HostX0@users.noreply.github.com'
          git commit -m 'Publish simplified menu, six featured dishes, inline quantity controls and corrected half-chicken photo'
          git push origin HEAD:main
          git rev-parse HEAD
          git archive --format=zip --output="$RUNNER_TEMP/FanFood_UX_Published.zip" HEAD
      - name: Verify the new release on the actual Vercel production site
        env:
          BASE_URL: https://fan-food.vercel.app
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/qa/package.json
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://fan-food.vercel.app/release.json?verify=$(date +%s)" | grep -q 'quick-controls-20260917-1'; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1 || { echo 'Updated production release not ready'; exit 1; }
          QUICK_SMOKE=1 REPORT_DIR=test-results/quick-live node tests/quick-controls.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/checkout-live node tests/checkout-enhancements.mjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanfood-ux-release-${{ github.run_id }}
          path: |
            test-results/
            ${{ runner.temp }}/FanFood_UX_Published.zip
            ${{ runner.temp }}/serve.log
          retention-days: 14
          if-no-files-found: warn
