name: Build and browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fan-food-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test order calculations and validation
        run: npm test
      - name: Build actual Next.js production site
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/fanfood-browser" --no-fund --no-audit playwright@1.63.0
          node "$RUNNER_TEMP/fanfood-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit firefox
      - name: Verify the production build in real browser engines
        env:
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/fanfood-browser/package.json
          BASE_URL: http://127.0.0.1:3000
          REPORT_DIR: test-results/local
        run: |
          node scripts/serve.mjs out > "$RUNNER_TEMP/fanfood-server.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs
      - name: Verify public Vercel menu without sending an order
        if: github.ref == 'refs/heads/main'
        env:
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/fanfood-browser/package.json
          BASE_URL: https://fan-food.vercel.app
          REPORT_DIR: test-results/live
          QUICK_SMOKE: '1'
        run: node tests/browser-smoke.mjs
      - name: Package root-level deployment source
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/FanFood_Deploy_Ready.zip HEAD
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fan-food-browser-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload deployment-ready source
        uses: actions/upload-artifact@v4
        with:
          name: fan-food-deploy-ready
          path: dist/FanFood_Deploy_Ready.zip
          retention-days: 14
      - name: Upload static production output
        uses: actions/upload-artifact@v4
        with:
          name: fan-food-production-output
          path: out/
          retention-days: 7
