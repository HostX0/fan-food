name: Validate final menu polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/polish-v5-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fanfood-polish-v5
  cancel-in-progress: false
jobs:
  validate-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped source edits with exact preimage checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,zlib,hashlib,urllib.request
          from pathlib import Path
          parts=['608a468c955f0b4367a2b562f83552f3c662c30f','67efd519d8bee0f05c3dab7dba884e24ed057b9e','476b1d75d63b851be591797c7cdc128264a035a2','4e27d621120bbd31d891356bae8c55dc6f20ba3c']
          packed=b''
          for sha in parts:
            req=urllib.request.Request('https://api.github.com/repos/HostX0/fan-food/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
            chunk=base64.b64decode(data['content'])
            assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
            packed+=chunk
          raw=zlib.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='c2da5eef449e4646d29ca28f7292f0f2bfb8bed94a88b1b35b73acdd435fa83a'
          changes=json.loads(raw);root=Path.cwd()
          for c in changes:
            p=root/c['p'];assert not c['p'].startswith('.github/') and p.resolve().is_relative_to(root) and not p.is_symlink()
            before=p.read_bytes() if p.exists() else None
            if c['sha']: assert before is not None and hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()==c['sha'],'Concurrent edit: '+c['p']
            else: assert before is None,'Path exists: '+c['p']
            lines=before.decode().splitlines(keepends=True) if before is not None else []
            for start,end,text in reversed(c['edits']): lines[start:end]=[text]
            after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==c['after']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(after);print('Updated',c['p'])
          Path(os.environ['RUNNER_TEMP']+'/polish-paths.json').write_text(json.dumps([c['p'] for c in changes]))
          PY
      - name: Optimize the dedicated editorial Iraqi hero image
        run: |
          python3 -m pip install --quiet Pillow
          curl -fsSL --retry 3 --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3CpFEvxerpl4o5efok2zUSBMeRV/hf_20260917_221848_0ce8ed54-e905-41fe-83fa-8742ef3b06d1.png' -o "$RUNNER_TEMP/hero.png"
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          from PIL import Image,ImageOps
          raw=Path(os.environ['RUNNER_TEMP'])/'hero.png';im=Image.open(raw);im.load();assert im.width>=2000 and im.height>=1000
          out=Path('public/images/hero-v5');out.mkdir(parents=True,exist_ok=True)
          for width in [800,1440,2000]: ImageOps.fit(im.convert('RGB'),(width,round(width*9/16)),Image.Resampling.LANCZOS).save(out/f'table-{width}.webp','WEBP',quality=86,method=6)
          ImageOps.fit(im.convert('RGB'),(1200,630),Image.Resampling.LANCZOS).save(out/'table-og.jpg','JPEG',quality=88,optimize=True)
          review=Path('test-results');review.mkdir(exist_ok=True)
          ImageOps.fit(im.convert('RGB'),(1600,900),Image.Resampling.LANCZOS).save(review/'hero-review.jpg',quality=92)
          manifest={'generated':True,'job':'0ce8ed54-e905-41fe-83fa-8742ef3b06d1','originalSha256':hashlib.sha256(raw.read_bytes()).hexdigest(),'assets':[{'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(out.glob('*'))]}
          Path('docs/hero-v5-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Locked install, unit tests, TypeScript and real production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fanfood-playwright-1.63.0-ubuntu-v1
      - name: Prepare browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Check navigation, checkout, accessibility preferences and existing ordering flows
        env:
          BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REQUIRE_FROM: ${{ runner.temp }}/qa/package.json
        run: |
          node scripts/serve.mjs out > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
          REPORT_DIR=test-results/polish-local node tests/polish-browser.mjs
          REPORT_DIR=test-results/browser-local node tests/browser-smoke.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/checkout-local node tests/checkout-enhancements.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/quick-local node tests/quick-controls.mjs
          QUICK_SMOKE=1 REPORT_DIR=test-results/final-local node tests/final-menu-browser.mjs
          REPORT_DIR=test-results/style-local node tests/production-style.mjs
      - name: Preserve validated source on a review branch without changing the live application
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed; refusing to overwrite'; exit 1; }
          python3 - <<'PY'
          import subprocess,json,os
          from pathlib import Path
          paths=json.loads(Path(os.environ['RUNNER_TEMP']+'/polish-paths.json').read_text())
          subprocess.run(['git','add','--',*paths,'public/images/hero-v5','docs/hero-v5-manifest.json'],check=True)
          PY
          git config user.name 'HostX0'
          git config user.email '42905848+HostX0@users.noreply.github.com'
          git commit -m 'Polish Iraqi hero, combine delivery address and keep category navigation anchored'
          branch="release/final-polish-v5-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > test-results/validated-commit.txt
          echo "$branch" > test-results/validated-branch.txt
          git archive --format=zip --output="$RUNNER_TEMP/FanFood_Polish_Source.zip" HEAD
      - name: Retain browser screenshots and verified source for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanfood-polish-review-${{ github.run_id }}
          path: |
            test-results/
            ${{ runner.temp }}/FanFood_Polish_Source.zip
            ${{ runner.temp }}/serve.log
          retention-days: 14
          if-no-files-found: warn
