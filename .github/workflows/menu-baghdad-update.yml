name: Baghdad menu update and verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/menu-baghdad-update.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fanfood-baghdad-update
  cancel-in-progress: false
jobs:
  apply-build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch and verify the scoped update package
        env:
          BUNDLE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4708-8210-9bb4-2e5db354dd8d/raw?se=2026-09-17T18%3A46%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=cd718492-7e6f-5152-8ad5-85fa059f33d6&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A16%3A18Z&ske=2026-09-18T18%3A16%3A18Z&sks=b&skv=2026-02-06&sig=0gkVrliYP%2BRcZCH1v8OTWbGqHr8noCYwOqt5ucC2lys%3D'
        run: |
          curl -fsSL --retry 3 --max-time 120 "$BUNDLE_URL" -o "$RUNNER_TEMP/fanfood-update.zip"
          echo "f6e6ab86c2269d9c6c1cf937432f02d522eec3f3230213da4dad385eb43b5c8c  $RUNNER_TEMP/fanfood-update.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,json,os,hashlib,subprocess
          from pathlib import Path
          root=Path.cwd()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'fanfood-update.zip') as z:
            manifest=json.loads(z.read('apply-manifest.json'))
            assert manifest['release']=='fanfood-baghdad-v2'
            for item in manifest['files']:
              rel=item['path']; dest=(root/rel).resolve()
              assert dest.is_relative_to(root) and rel.startswith(('src/','tests/','scripts/','docs/','public/'))
              assert not dest.is_symlink()
              before=item['expected_git_blob']
              if before:
                current=subprocess.check_output(['git','hash-object',rel],text=True).strip()
                assert current==before, f'Concurrent edit detected: {rel}'
              else:
                assert not dest.exists(),f'New destination already exists: {rel}'
              data=z.read(rel)
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          PY
      - name: Prepare approved local product photography and map library
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare-generated-photos.py
          mkdir -p "$RUNNER_TEMP/leaflet" public/vendor/leaflet
          npm pack leaflet@1.9.4 --pack-destination "$RUNNER_TEMP/leaflet" --silent
          tar -xzf "$RUNNER_TEMP/leaflet/leaflet-1.9.4.tgz" -C "$RUNNER_TEMP/leaflet"
          cp -R "$RUNNER_TEMP/leaflet/package/dist/." public/vendor/leaflet/
          cp "$RUNNER_TEMP/leaflet/package/LICENSE" public/vendor/leaflet/LICENSE
          rm -f public/vendor/leaflet/*.map public/vendor/leaflet/leaflet-src.* public/vendor/leaflet/leaflet.esm.js
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests and strict TypeScript
        run: |
          npm test
          npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Install isolated cross-browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Test compiled production output on phone, tablet and desktop
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          export PLAYWRIGHT_REQUIRE_FROM="$RUNNER_TEMP/qa/package.json"
          PORT=3000 node scripts/serve.mjs out > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
          node tests/browser-smoke.mjs
          node tests/checkout-enhancements.mjs
      - name: Commit only validated site changes, preserving deployment settings
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed during validation. Refusing overwrite.'; exit 1; }
          git config user.name 'HostX0'
          git config user.email '42905848+HostX0@users.noreply.github.com'
          git add src public/images/products public/vendor/leaflet public/release.json tests/core.test.mjs tests/enhancements.test.mjs tests/checkout-enhancements.mjs scripts/prepare-generated-photos.py docs/RELEASE_V2.md
          git rm .github/workflows/menu-baghdad-update.yml
          git commit -m 'Ship 58 individual dish photos, Baghdad-only checkout, confirmed Waze pins and smart Arabic search'
          git push origin HEAD:main
          git archive --format=zip --output="$RUNNER_TEMP/FanFood_Production_Source.zip" HEAD
      - name: Verify the updated production alias and actual checkout
        env:
          BASE_URL: https://fan-food.vercel.app
          QUICK_SMOKE: '1'
          REPORT_DIR: test-results/live
        run: |
          export PLAYWRIGHT_REQUIRE_FROM="$RUNNER_TEMP/qa/package.json"
          live=0
          for i in $(seq 1 45); do
            if curl -fsSL "https://fan-food.vercel.app/release.json?verify=$(date +%s)" | grep -q 'fanfood-baghdad-v2'; then live=1; break; fi
            sleep 10
          done
          test "$live" = 1 || { echo 'Updated Vercel production alias not ready yet'; exit 1; }
          node tests/checkout-enhancements.mjs
      - name: Preserve test evidence and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanfood-baghdad-qa-${{ github.run_id }}
          path: |
            test-results/
            ${{ runner.temp }}/FanFood_Production_Source.zip
            ${{ runner.temp }}/serve.log
          if-no-files-found: warn
          retention-days: 14
